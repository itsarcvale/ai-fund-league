name: Daily close
# Weekdays 21:30 UTC = after the US close. Executes pending orders, marks every fund, publishes the site.
on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: league
  cancel-in-progress: false

jobs:
  close:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Refresh market data
        run: python -m league update
      - name: Execute and mark
        run: python -m league daily
      - name: Save
        run: |
          git config user.name "league-bot"
          git config user.email "league-bot@users.noreply.github.com"
          git add data site
          git commit -m "Close $(date -u +%F)" || echo "nothing to commit"
          git push

  deploy:
    needs: [close]
    if: always() && (needs.close.result == 'success' || needs.close.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
