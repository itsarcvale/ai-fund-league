name: Daily decisions
# Weekdays 12:00 UTC = before the US open (8:00 ET in summer, 7:00 ET in winter).
on:
  schedule:
    - cron: "0 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: league
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Refresh market data
        run: python -m league update
      - name: Ask every manager
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m league decide
      - name: Save
        run: |
          git config user.name "league-bot"
          git config user.email "league-bot@users.noreply.github.com"
          git add data site
          git commit -m "Decisions $(date -u +%F)" || echo "nothing to commit"
          git push
